# Dependencies are vendored into Packages/ because the Wally registry API
# is not reachable from the build environment. Versions pinned below for
# reference; refresh by re-vendoring from the upstream repositories.
[package]
name = "mythlings/mythlings"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

